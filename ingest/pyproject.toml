[project]
name = "presyo-ingest"
version = "0.1.0"
description = "Fetch and normalize Philippine government price reports for Presyo"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "shapely>=2.1.2",
]

[project.scripts]
presyo-ingest = "presyo_ingest:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
