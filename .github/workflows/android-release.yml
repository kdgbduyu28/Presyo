name: Android release

# Push a version tag (./scripts/release.sh --apk, or `git tag v1.2.0 && git push origin v1.2.0`)
# to build the APK and attach it to a GitHub Release you can download straight to a phone.
# "Run workflow" on the Actions tab builds one without a release (download it from the run).
# Free: GitHub Actions minutes are unlimited for public repositories.
# The APK reads prices from https://presyo.pages.dev/data (kept fresh by update.yml), so the
# build needs no data step.
#
# Optional repository secrets, to sign with your own release key:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK keeps Expo's template debug signature, which is the same on every
# build, so a new release still installs over the old one. Switching to a release key later
# means uninstalling once.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NAME: Presyo

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      # The tag is the version people see; the run number keeps versionCode rising so
      # Android accepts each release as an update.
      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p 'require("./app.json").expo.version')-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APK=$GITHUB_WORKSPACE/${NAME,,}-v${version}.apk" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
            j.expo.version = process.env.VERSION;
            j.expo.android = { ...j.expo.android, versionCode: Number(process.env.GITHUB_RUN_NUMBER) };
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2));
          '

      # android/ is generated here and never committed.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # arm64 covers current phones, armeabi-v7a older and budget ones.
      - name: Build APK
        working-directory: app/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk "$APK"

      - name: Sign with the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, keeping the debug signature"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS "$APK"
          "$apksigner" verify "$APK"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}-apk
          path: ${{ env.APK }}

      - name: Write release notes
        if: github.ref_type == 'tag'
        run: |
          file="$(basename "$APK")"
          {
            echo "## Install on your phone"
            echo
            echo "1. Open this page on your Android phone and tap **${file}** below."
            echo "2. When asked, allow your browser to install unknown apps, then tap **Install**."
            echo "3. If Play Protect says the app is unrecognised, tap **Install anyway**."
            echo
          } > "$RUNNER_TEMP/release-notes.md"

      # The gh CLI is preinstalled on GitHub's runners; GITHUB_TOKEN is enough to publish.
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "$NAME $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi
